<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanAway - Perfil</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/trip.css" />
  <link rel="stylesheet" href="css/trip-budget.css" />
  <link rel="stylesheet" href="css/trip-itinerary.css" />
  <link rel="stylesheet" href="css/trip-activities.css" />
  <link rel="stylesheet" href="css/trip-records.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>

<body>

<header class="site-header site-header--blue">
  <h1 class="logo">
    <a href="index.html" class="logo">
      <span class="logo-plan">Plan</span>
      <span class="logo-away">Away✈</span>
    </a>
  </h1>

  <nav class="site-nav">
    <a class="site-nav__link site-nav__link--yellow" href="home.html">Viagens</a>
    <a class="site-nav__link site-nav__link--yellow" href="create-trip.html">Nova viagem</a>
    <a class="site-nav__link site-nav__link--yellow" href="itinerary.html">Itinerário</a>
    <a class="site-nav__link site-nav__link--yellow" href="budget.html">Budget</a>
  </nav>

  <a class="site-header__profile is-active" href="profile.html">O meu perfil</a>
</header>

<main class="page-shell page-shell--profile">

  <h1 class="page-title profile-label">O MEU PERFIL</h1>

  <div class="profile-top">
    <div class="profile-avatar"></div>

    <div class="profile-user">
      <p class="profile-name">Olá, Diogo Martins!</p>
      <p class="profile-role">Viajante Económico</p>

      <button id="logoutButton" class="profile-logout-btn">Sair da conta</button>
    </div>
  </div>

  <section class="profile-grid">
    <article class="card card--yellow">
      <p>Viagens criadas</p>
      <strong id="profileTripsCount">0</strong>
    </article>

    <article class="card card--yellow">
      <p>Atividades</p>
      <strong id="profileActivitiesCount">0</strong>
    </article>

    <article class="card card--yellow">
      <p>Despesas</p>
      <strong id="profileExpensesCount">0</strong>
    </article>
  </section>

</main>

<footer class="site-footer">
  <p>DIOGO MARTINS 20250914 IADE 2026 PlanAway</p>
</footer>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
