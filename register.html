<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanAway - Registar</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/register.css" />
</head>

<body>
  <main class="auth-shell">

    <div class="auth-card">
      <h1 class="auth-logo">Plan<span>Away✈</span></h1>

      <form class="auth-form">
        <input id="registerEmail" type="email" placeholder="email@" />
        <input id="registerPassword" type="password" placeholder="PASSWORD" />

        <button id="registerButton" type="button" class="auth-button">
          CRIAR CONTA
        </button>

      </form>

      <p class="auth-helper">
        Já tem conta? <a href="login.html">Iniciar sessão</a>
      </p>
    </div>

    <footer class="auth-footer">
      <div class="auth-footer-line"></div>
      <span>FOOTER</span>
    </footer>
  </main>

  <script src="js/auth.js"></script>
<script>
  document.getElementById('registerButton').addEventListener('click', () => {
    const email = document.getElementById('registerEmail').value.trim();
    const password = document.getElementById('registerPassword').value.trim();

    if (!email || !password) {
      alert('Preenche o email e a password.');
      return;
    }

    registerUser(email, password);
  });
</script>
</body>
</html>
