<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanAway - Login</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <main class="auth-shell">

    <section class="auth-card">
      <h1 class="auth-logo">Plan<span>Away✈</span></h1>

      <form class="auth-form">
        <input id="loginEmail" type="email" placeholder="email@" />
        <input id="loginPassword" type="password" placeholder="PASSWORD" />

        <button id="loginButton" type="button" class="auth-button">
          INICIAR SESSÃO
        </button>
      </form>

      <p class="auth-helper">
        Ainda não tem conta?
        <a href="register.html">Criar conta</a>
      </p>
    </section>

    <footer class="auth-footer">
      <div class="auth-footer-line"></div>
      <span>FOOTER</span>
    </footer>
  </main>

  <script src="js/auth.js"></script>
<script>
  document.getElementById('loginButton').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
      alert('Preenche o email e a password.');
      return;
    }

    loginUser(email, password);
  });
</script>
</body>
</html>
